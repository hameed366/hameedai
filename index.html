<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>صانع الاختبارات السحري – رياضيات التاسع</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
:root{--bg:#f3f0ff;--tx:#1e1646;--mut:#6a6296;--card:rgba(255,255,255,.74);--bd:rgba(124,58,237,.2);--chip:rgba(255,255,255,.85);--g1:rgba(139,92,246,.32);--g2:rgba(6,182,212,.24);--g3:rgba(244,114,182,.26);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c0a22;--tx:#f2edff;--mut:#b3aadf;--card:rgba(255,255,255,.07);--bd:rgba(255,255,255,.13);--chip:rgba(255,255,255,.06);--g1:rgba(139,92,246,.38);--g2:rgba(6,182,212,.26);--g3:rgba(244,114,182,.24)}}
:root[data-theme="dark"]{--bg:#0c0a22;--tx:#f2edff;--mut:#b3aadf;--card:rgba(255,255,255,.07);--bd:rgba(255,255,255,.13);--chip:rgba(255,255,255,.06);--g1:rgba(139,92,246,.38);--g2:rgba(6,182,212,.26);--g3:rgba(244,114,182,.24)}
html{scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font-family:'Cairo',Tahoma,Arial,sans-serif;color:var(--tx);background:radial-gradient(60% 40% at 95% 0%,var(--g1),transparent),radial-gradient(50% 40% at 0% 35%,var(--g2),transparent),radial-gradient(60% 50% at 85% 100%,var(--g3),transparent),var(--bg);background-attachment:fixed;min-height:100vh;padding-bottom:96px}
.wrap{max-width:980px;margin:auto;padding:18px 14px}
.hero{text-align:center;padding:22px 8px 8px}
.hero h1{margin:0;font-size:clamp(26px,6vw,42px);font-weight:900;background:linear-gradient(90deg,#8b5cf6,#06b6d4,#f472b6,#f59e0b);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 18px rgba(139,92,246,.35))}
.hero p{color:var(--mut);margin:6px 0 0;font-size:15px}
.step{display:flex;align-items:center;gap:10px;margin:26px 0 12px;font-weight:900;font-size:20px}
.step b{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#8b5cf6,#f472b6);color:#fff;box-shadow:0 0 18px #8b5cf6aa}
.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 10px 34px -16px rgba(80,40,160,.45)}
.tabs{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.tab{font:inherit;color:var(--tx);cursor:pointer;text-align:center;padding:12px 8px;border-radius:18px;border:1px solid var(--bd);background:var(--card);transition:.25s;display:flex;flex-direction:column;gap:2px;align-items:center}
.tab b{font-size:24px}.tab span{font-weight:700;font-size:14px}.tab small{color:var(--mut);font-size:11.5px;line-height:1.3}
.tab.on{background:linear-gradient(135deg,var(--c),var(--c2));color:#fff;border-color:transparent;box-shadow:0 10px 28px -8px var(--c);transform:translateY(-2px)}
.tab.on small{color:#fffd}
#lessons{display:grid;gap:12px;margin-top:14px}
.les{padding:14px;border-inline-start:5px solid var(--c)}
.les header{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:10px}
.les h3{margin:2px 0;font-size:16.5px}.les small{color:var(--mut)}
.no{display:inline-block;background:linear-gradient(135deg,var(--c),var(--c2));color:#fff;border-radius:10px;padding:1px 10px;font-weight:700;font-size:13px}
.all{font:inherit;font-size:12.5px;cursor:pointer;border:1px solid var(--c);color:var(--c);background:transparent;border-radius:999px;padding:4px 12px;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-size:14px;color:var(--tx);cursor:pointer;display:flex;align-items:center;gap:7px;padding:8px 13px;border-radius:14px;border:1px solid var(--bd);background:var(--chip);transition:.2s;text-align:start}
.chip i{font-style:normal;font-size:17px;filter:grayscale(.6);transition:.2s}
.chip:hover{transform:translateY(-2px)}
.chip.on{background:linear-gradient(135deg,var(--c),var(--c2));color:#fff;border-color:transparent;box-shadow:0 8px 22px -8px var(--c)}
.chip.on i{filter:none;transform:scale(1.2) rotate(-8deg)}
.types{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.ty{padding:16px;text-align:center}
.ty .ic{font-size:34px}.ty h4{margin:4px 0 10px;font-size:17px}
.ty label{display:block;color:var(--mut);font-size:12.5px;margin-top:8px}
.st{display:flex;justify-content:center;align-items:center;gap:12px;margin-top:4px}
.st button{width:36px;height:36px;border-radius:50%;border:0;font-size:20px;cursor:pointer;color:#fff;background:linear-gradient(135deg,#8b5cf6,#06b6d4);box-shadow:0 4px 14px -4px #8b5cf6}
.st output{min-width:34px;font-size:22px;font-weight:900}
.opts{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.opts input,.opts select{font:inherit;padding:10px 12px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);flex:1;min-width:150px}
.go{display:block;width:100%;margin-top:16px;font:inherit;font-weight:900;font-size:19px;color:#fff;border:0;border-radius:18px;padding:15px;cursor:pointer;background:linear-gradient(110deg,#8b5cf6,#ec4899,#06b6d4,#8b5cf6);background-size:300% 100%;animation:sh 6s linear infinite;box-shadow:0 12px 34px -10px #a855f7}
.go:disabled{opacity:.75;cursor:wait}
@keyframes sh{to{background-position:-300% 0}}
.bar{position:fixed;inset-inline:0;bottom:0;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;gap:10px;align-items:center;background:var(--card);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--bd);z-index:5;font-size:14px;flex-wrap:wrap}
.bar b{font-size:18px;background:linear-gradient(90deg,#8b5cf6,#f472b6);-webkit-background-clip:text;background-clip:text;color:transparent}
.bar button{font:inherit;cursor:pointer;border-radius:999px;padding:7px 16px;border:1px solid var(--bd);background:transparent;color:var(--tx)}
.bar .nx{background:linear-gradient(135deg,#8b5cf6,#ec4899);color:#fff;border:0}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.tools button{font:inherit;cursor:pointer;border-radius:12px;padding:9px 14px;border:1px solid var(--bd);background:var(--card);color:var(--tx)}
.gp{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
.gb{font:inherit;color:#fff;cursor:pointer;border:0;border-radius:28px;padding:20px 8px 16px;display:flex;flex-direction:column;align-items:center;gap:2px;background:linear-gradient(135deg,var(--c),var(--c2));box-shadow:0 14px 30px -12px var(--c);opacity:.78;transition:.3s;position:relative;overflow:hidden}
.gb::after{content:"✨";position:absolute;top:8px;inset-inline-end:12px;opacity:.7}
.gb b{font-size:54px;line-height:1.1;text-shadow:0 0 22px #fff9,0 4px 14px #0004}.gb span{font-weight:900;font-size:17px}.gb small{opacity:.9;font-size:12px}
.gb:hover{opacity:1;transform:translateY(-4px) scale(1.03)}
.gb.on{opacity:1;outline:4px solid #fff;outline-offset:-4px;box-shadow:0 0 0 3px var(--c),0 16px 40px -8px var(--c);animation:fl 3s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-5px)}}
.cfg{padding:14px;margin-top:12px}.cfg .row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}.cfg .row>*{flex:1;min-width:150px}.cfg label{font-size:13.5px;color:var(--mut)}.cfg input,.cfg select,.cfg textarea{font:inherit;padding:9px 11px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);width:100%;margin-top:4px}.cfg summary{cursor:pointer;font-weight:700;font-size:16px}.pal{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0}.pal button{min-width:34px;height:34px;border-radius:9px;border:1px solid var(--bd);background:var(--chip);color:var(--tx);cursor:pointer;font:inherit;font-size:15px;direction:ltr}.pal b{flex-basis:100%;font-size:12px;color:var(--mut)}.cfg .add{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:9px 18px;color:#fff;background:linear-gradient(135deg,#8b5cf6,#06b6d4);margin:6px 6px 0 0}
.qc{display:flex;gap:10px;padding:10px 12px;margin-bottom:8px;cursor:pointer;align-items:flex-start;line-height:1.8}.qc.on{border-color:#8b5cf6;box-shadow:0 0 0 2px #8b5cf6aa}.qc input{margin-top:7px;width:20px;height:20px;flex:none}.qc .o{display:flex;gap:4px 14px;flex-wrap:wrap;font-size:13.5px;color:var(--mut)}.qc .ok{color:#10b981;font-weight:700}.qc .so{font-size:13px;color:#10b981}.sgh{margin:18px 0 8px;font-size:17px}
#toast{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));inset-inline:14px;margin:auto;max-width:420px;text-align:center;background:#1e1646;color:#fff;padding:11px 16px;border-radius:14px;z-index:9;opacity:0;pointer-events:none;transition:.3s;box-shadow:0 10px 30px #0006}
#toast.on{opacity:1}
</style>
<style id="ps">
.paper{background:#fff;color:#111;border-radius:14px;padding:26px 28px;font-family:'Cairo',Tahoma,Arial,sans-serif;line-height:1.9;box-shadow:0 14px 40px -14px rgba(60,30,140,.5);border-top:6px solid #8b5cf6;direction:rtl}
.paper h2{text-align:center;margin:0 0 4px;font-size:22px}
.paper .meta{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;border:1.5px solid #333;border-radius:8px;padding:6px 12px;margin:10px 0 14px;font-size:14px}
.paper h4{margin:18px 0 6px;font-size:16.5px;background:#f1ecff;border-inline-start:5px solid #8b5cf6;padding:3px 10px;border-radius:6px}
.paper h4 small{font-weight:400;color:#555}
.paper ol{margin:0;padding-inline-start:26px}.paper li{margin-bottom:10px}.paper p{margin:0}
.paper .op{display:grid;grid-template-columns:repeat(2,1fr);gap:0 14px}
.paper .bx{float:left;font-weight:400;letter-spacing:2px}
.paper .an{display:none;color:#047857;font-weight:700}
.paper .sol{background:#ecfdf5;padding:4px 10px;border-radius:8px;margin-top:4px;font-weight:600}
.paper .sp{height:160px;background:repeating-linear-gradient(transparent 0 31px,#c9c9c9 31px 32px);border-radius:6px}.paper{-webkit-print-color-adjust:exact;print-color-adjust:exact}.paper li{break-inside:avoid}.show .paper .an{display:block}.show .paper i.an{display:inline}
.show .paper .ok{color:#047857;font-weight:900;text-decoration:underline}
.paper .hd{display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:center;font-size:14px;line-height:1.5}.paper .lg{width:80px;height:80px;display:grid;place-items:center}.paper .lg img{max-width:100%;max-height:100%}.paper .c{flex:1}
.paper input[type=radio]{margin-inline-end:4px}.paper textarea{width:100%;border:1px solid #bbb;border-radius:8px;padding:8px;font:inherit;margin-top:4px}.paper .fl{display:block;font-size:13px;color:#555;margin:4px 0}.paper li.g{background:#ecfdf5;border-radius:8px}.paper li.w{background:#fef2f2;border-radius:8px}.paper .sub{display:block;margin:18px auto 0;font:inherit;font-weight:700;border:0;border-radius:12px;padding:10px 26px;color:#fff;background:#7c3aed;cursor:pointer}.paper #res{text-align:center;margin-top:10px;font-weight:700}.paper .meta input{font:inherit;border:0;border-bottom:1px dotted #333;min-width:150px}
sup{font-size:.7em;vertical-align:super;line-height:0}.rt{display:inline-flex;direction:rtl;align-items:stretch;unicode-bidi:isolate}.rt .rs{display:inline-block;transform:scaleX(-1);font-size:1.3em;line-height:1}.rt .rr{border-top:1.5px solid currentColor;padding:0 4px;margin-top:2px}.rt.l{direction:ltr}.rt.l .rs{transform:none}.ix{font-size:.6em;align-self:flex-start}.pvw{margin:6px 0;padding:6px 10px;border-radius:10px;background:#fff;color:#111;min-height:32px;font-size:16px}
.mb{border:2px solid #7c3aed;border-radius:8px;padding:0 12px;font-size:15px;margin-inline-start:10px;white-space:nowrap}.mx{white-space:nowrap;unicode-bidi:isolate}.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 3px;line-height:1.3;font-size:.95em}.fr>span{padding:0 3px;text-align:center}.fr>span:first-child{border-bottom:2px solid currentColor}.paper .pt{list-style:none;padding-inline-start:8px;margin-top:4px}.paper+.paper{margin-top:20px;page-break-before:always;break-before:page}
@page{size:A4;margin:12mm}
@media print{.sub,textarea,.bar,#toast,.hero,.step,.tools,.tabs,#lessons,#aq,#bk,#tp,.types,.opts,.cfg,.go,#sg{display:none!important}html,body{background:#fff!important;padding:0!important;margin:0!important;min-height:0}:root{padding:0}.wrap{padding:0;max-width:none}.paper{box-shadow:none;border-radius:0;border-top:0;padding:0}.paper h4{background:#eee!important}}
</style>

<body>
<div class="wrap">
 <div class="hero"><h1>✨ صانع الاختبارات السحري</h1><p id="sub">رياضيات الصف التاسع · الفصل الدراسي الأول 2026–2027 · الجزء الأول</p></div>
 <div class="step"><b>🎓</b> اختر الصف</div>
 <div class="gp" id="gp"></div>
 <div class="step"><b>١</b> اختر البنود المطلوبة من دروس الكتاب</div>
 <div class="tabs" id="tabs"></div>
 <div id="lessons"></div>

<div class="card cfg" id="tp"><label>مواضيع أو دروس إضافية (اختياري، تُدمج مع البنود المحددة)<textarea id="tx" rows="2"></textarea></label></div>
 <div class="step"><b>٢</b> أنواع الأسئلة وأعدادها</div>
 <div class="types" id="types"></div>
 <details class="card cfg" id="aq"><summary>➕ أضف سؤالًا من عندك (مع لوحة الرموز)</summary>
 <div class="row"><label>نوع السؤال<select id="qt" onchange="qf()"><option value="es">مقالي</option><option value="mcq">اختيار من متعدد</option><option value="tf">صح وخطأ</option></select></label></div>
 <textarea id="qq" rows="2" oninput="pv()" placeholder="نص السؤال. ضع العبارات الرياضية بين $ مثل $٣/٤ + ٢$ — للأس س^٢ وللجذر √(٢٥) — وللمقالي متعدد الطلبات: كل طلب في سطر"></textarea><div class="pvw" id="pv"></div>
 <div id="qm" hidden><div class="row"><input class="qo" placeholder="الخيار أ"><input class="qo" placeholder="الخيار ب"><input class="qo" placeholder="الخيار ج"><input class="qo" placeholder="الخيار د"></div><select id="qa"><option value="0">الإجابة الصحيحة: أ</option><option value="1">ب</option><option value="2">ج</option><option value="3">د</option></select></div>
 <select id="qtf" hidden><option value="1">الإجابة: صح</option><option value="0">الإجابة: خطأ</option></select>
 <textarea id="qs" rows="1" placeholder="الحل النموذجي (اختياري، لكل طلب في سطر)"></textarea>
 <div class="pal" id="pal"></div>
 <button class="add" onclick="addq()">إضافة السؤال</button><button class="add" onclick="C.mcq=[];C.tf=[];C.es=[];$('#qn').textContent='تم مسح أسئلتك'">مسح أسئلتي</button> <small id="qn"></small>
</details>
<div class="opts">
  <input id="ttl" oninput="tdirty=1" value="اختبار قصير – رياضيات التاسع" aria-label="عنوان الاختبار">
  <select id="lvl" aria-label="المستوى"><option>متدرج (من السهل إلى الصعب)</option><option>سهل</option><option>متوسط</option><option>صعب (تفكير عليا)</option></select>
 </div>
 <div class="step"><b>٣</b> نمط الاختبار والترويسة</div>
<div class="card cfg" oninput="sv()">
 <div class="row"><label>نمط الاختبار<select id="md" onchange="if(R)paper()"><option value="p">ورقي (للطباعة)</option><option value="e">إلكتروني</option></select></label>
 <label>الأرقام<select id="dg" onchange="if(R)paper()"><option value="c">حسب السياق</option><option value="h">هندية ١٢٣</option><option value="n">إنجليزية 123</option></select></label>
 <label>لغة الاختبار<select id="ln" onchange="if(R)paper()"><option value="ar">العربية</option><option value="en">English</option></select></label><label>رموز المتغيرات<select id="sy"><option value="a">عربية (س، ص، جا)</option><option value="e">إنجليزية (x, y, sin)</option></select></label><label>عدد النماذج<select id="nm" onchange="if(R)paper()"><option value="1">نموذج واحد</option><option value="2">نموذجان (أ) و(ب)</option></select></label><label>مساحة حل المقالي<select id="sp"><option value="110">صغيرة</option><option value="180" selected>متوسطة</option><option value="280">كبيرة</option><option value="400">كبيرة جدًا</option></select></label></div>
 <div class="row"><label>اسم المدرسة<input id="sch" placeholder="اسم المدرسة"></label><label>الصف<select id="gr" onchange="gsel()"></select></label><label>المادة<select id="sb" onchange="$('#sbo').hidden=this.value!='أخرى'"><option>رياضيات</option><option>علوم</option><option>فيزياء</option><option>كيمياء</option><option>أحياء</option><option>اللغة العربية</option><option>اللغة الإنجليزية</option><option>التربية الإسلامية</option><option>الدراسات الاجتماعية</option><option>الحاسوب</option><option>أخرى</option></select><input id="sbo" hidden placeholder="اسم المادة"></label><label>الفترة الدراسية<select id="tm"><option value="1">الفترة الدراسية الأولى</option><option value="2">الفترة الدراسية الثانية</option></select></label></div>
 <div class="row"><label>شعار وزارة التربية<input type="file" accept="image/*" onchange="up(this,'L1')"></label><label>شعار المدرسة<input type="file" accept="image/*" onchange="up(this,'L2')"></label></div>
</div>
<button class="go" id="go" onclick="gen()">🔎 اقترح الأسئلة</button>
 <div id="sg"></div>
 <div id="out"></div>
</div>
<div class="bar"><span>البنود المحددة: <b id="cnt">٠</b></span><span>الدرجة الكلية: <b id="tot">٠</b></span><button onclick="clr()">مسح</button><button class="nx" onclick="document.getElementById('types').scrollIntoView()">التالي ⟵</button></div>
<div id="toast"></div>
<script>
const EN=()=>$("#ln").value=="en",SB=()=>$("#sb").value=="أخرى"?($("#sbo").value||"المادة"):$("#sb").value;
const $=s=>document.querySelector(s),ar=n=>String(n).replace(/\d/g,d=>"٠١٢٣٤٥٦٧٨٩"[d]);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const IC=["✨","🧩","🔮","🌟","🎯"];
let D=[
["الوحدة الأولى","الأعداد الحقيقية والعمليات عليها","#8b5cf6","#6366f1","🔢",[
["الجذور التربيعية والأعداد غير النسبية",20,"الجذر التربيعي والجذر الأساسي|الأعداد النسبية وغير النسبية|تقدير الجذور التربيعية|خواص الجذور التربيعية"],
["الأعداد الحقيقية (مقارنة – ترتيب)",24,"مجموعة الأعداد الحقيقية ومخطط ڤن|تمثيل الأعداد على خط الأعداد|مقارنة الأعداد الحقيقية وترتيبها|الفترات المحدودة وغير المحدودة"],
["العمليات على الأعداد الحقيقية",32,"ترتيب العمليات الحسابية|خواص العمليات|العمليات على الجذور|مسائل حياتية"],
["القيمة المطلقة",36,"مفهوم القيمة المطلقة|تبسيط عبارات القيمة المطلقة|حل معادلات تتضمن قيمة مطلقة"],
["حل متباينة من الدرجة الأولى في متغيّر واحد",43,"حل المتباينة وتمثيلها على خط الأعداد|المتباينات المركبة|متباينات تتضمن قيمة مطلقة|مسائل لفظية على المتباينات"],
